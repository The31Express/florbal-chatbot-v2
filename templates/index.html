<!DOCTYPE html>
<html>
<head>
    <title>Florbal chatbot</title>
</head>
<body>

<h1>Florbal chatbot</h1>

<div id="chatView">
    <input type="text" id="question" placeholder="Zeptej se na florbal">
    <button onclick="sendQuestion()">Odeslat</button>
    <button onclick="showDatabase()">Zobrazit DB</button>

    <p id="response"></p>
</div>

<div id="dbView" style="display:none;">
    <h2>Obsah databáze</h2>

    <pre id="dbContent"></pre>

    <button onclick="showChat()">Zpět</button>
</div>

<script>
function sendQuestion() {
    const question = document.getElementById("question").value;

    document.getElementById("response").innerText =
        "⏳ Čekám na odpověď serveru...";

    fetch("/ai", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ question: question })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("response").innerText = data.answer;
    });
}

function showDatabase() {
    fetch("/db")
    .then(res => res.json())
    .then(data => {

        document.getElementById("chatView").style.display = "none";
        document.getElementById("dbView").style.display = "block";

        document.getElementById("dbContent").innerText =
            JSON.stringify(data, null, 2);
    });
}

function showChat() {
    document.getElementById("dbView").style.display = "none";
    document.getElementById("chatView").style.display = "block";
}
</script>

</body>
</html>
